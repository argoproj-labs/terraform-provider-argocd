---
# Exposes the Argo CD API server on a fixed NodePort so that the tests can reach it from the host. The port is published
# by the K3s container (WithExposedPorts) and resolved via MappedPort to build the server address in
# internal/testhelpers/testcontainers.go. Keep the nodePort in sync with the port used there.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-proxy
spec:
  type: NodePort
  ports:
    - name: https
      port: 443
      protocol: TCP
      nodePort: 30123
      targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
